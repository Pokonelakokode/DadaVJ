<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dada VJ</title>
<style>
 :root { --bg:#0b0c10; --panel:#14161c; --line:#242833; --fg:#e8ecf1; --dim:#8b95a6; --accent:#ff7a3c; --accent2:#3cc8ff; }
 * { box-sizing: border-box; }
 body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif; }
 header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
 h1 { font-size:15px; margin:0; letter-spacing:.08em; text-transform:uppercase; }
 .dot { width:8px;height:8px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent); }
 main { display:grid; grid-template-columns: minmax(0,2fr) minmax(280px,1fr); gap:16px; padding:16px; }
 @media (max-width: 900px){ main{ grid-template-columns:1fr; } }
 .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
 img#preview { width:100%; border-radius:6px; background:#000; display:block; min-height:120px; }
 .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
 .stat { background:#0f1116; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
 .stat b { display:block; font-size:18px; font-variant-numeric: tabular-nums; }
 .stat span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
 .param { margin:10px 0; }
 .param label { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
 input[type=range]{ width:100%; accent-color:var(--accent); }
 button { background:#1c2029; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
 button:hover { border-color:var(--accent); color:var(--accent); }
 .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
</style>
</head>
<body>
<header><div class="dot"></div><h1>Dada VJ</h1><span id="status" style="color:var(--dim)">kapcsolodas...</span></header>
<main>
  <div>
    <div class="panel"><img id="preview" src="/preview.mjpg" alt="elonezet"></div>
  </div>
  <div>
    <div class="panel">
      <div class="stats">
        <div class="stat"><span>FPS</span><b id="fps">-</b></div>
        <div class="stat"><span>BPM</span><b id="bpm">-</b></div>
        <div class="stat"><span>Negyed</span><b id="beats">-</b></div>
        <div class="stat"><span>MIDI</span><b id="midi">-</b></div>
      </div>
      <div class="row">
        <button onclick="trig(36)">Kick</button>
        <button onclick="trig(38)">Snare</button>
        <button onclick="trig(42)">Hat</button>
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div style="color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em" id="shaderName">parameterek</div>
      <div id="params"></div>
    </div>
  </div>
</main>
<script>
var builtFor = "";
function trig(note){
  fetch("/api/command", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({cmd:"trigger", note:note, velocity:110})});
}
function setParam(i, v){
  fetch("/api/command", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({cmd:"set_param", index:i, value:v})});
}
function buildParams(params){
  var key = params.map(function(p){return p.name;}).join(",");
  if (key === builtFor) return;
  builtFor = key;
  var host = document.getElementById("params");
  host.innerHTML = "";
  params.forEach(function(p, i){
    var div = document.createElement("div"); div.className = "param";
    var lab = document.createElement("label");
    var name = document.createElement("span"); name.textContent = p.name;
    var val = document.createElement("span"); val.textContent = Number(p.value).toFixed(2);
    lab.appendChild(name); lab.appendChild(val);
    var r = document.createElement("input");
    r.type = "range"; r.min = p.min; r.max = p.max;
    r.step = (p.max - p.min) / 500; r.value = p.value;
    r.oninput = function(){ val.textContent = Number(r.value).toFixed(2); setParam(i, Number(r.value)); };
    div.appendChild(lab); div.appendChild(r);
    host.appendChild(div);
  });
}
function tick(){
  fetch("/api/state").then(function(r){ return r.json(); }).then(function(s){
    document.getElementById("status").textContent = s.layer ? ("reteg: " + s.layer) : "kesz";
    document.getElementById("fps").textContent = (s.fps || 0).toFixed(0);
    document.getElementById("bpm").textContent = (s.bpm || 0).toFixed(1);
    document.getElementById("beats").textContent = (s.beats || 0).toFixed(1);
    document.getElementById("midi").textContent = s.midi_messages || 0;
    if (s.params && s.params.length) {
      document.getElementById("shaderName").textContent = s.shader || "parameterek";
      buildParams(s.params);
    }
  }).catch(function(){ document.getElementById("status").textContent = "nincs kapcsolat"; });
}
setInterval(tick, 300); tick();
</script>
</body>
</html>
