[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Krisztián Gyurkó"]

[workspace.dependencies]
dada-audio = { path = "crates/dada-audio" }
dada-fx = { path = "crates/dada-fx" }
dada-core = { path = "crates/dada-core" }
dada-media = { path = "crates/dada-media" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Fejlesztés közben is gyors legyen: a saját kód debug, a függőségek optimalizálva.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
